[project]
name = "hpsv3-4bit"
version = "0.1.0"
description = "HPSv3 BF16 checkpoint construction and NF4 export tools on the original Transformers 4.46.3 layout. Use the repository root project for inference."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "transformers==4.46.3",
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
    "huggingface-hub<1.0",
    "hf-xet>=1.6.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.2.0",
    "protobuf>=7.35.1",
    "pyyaml>=6.0.3",
    "qwen-vl-utils>=0.0.14",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
