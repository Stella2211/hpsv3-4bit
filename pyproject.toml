[project]
name = "hpsv3-4bit-runtime"
version = "0.1.0"
description = "Inference-only HPSv3 and HPSv3++ NF4 runtime for Transformers 5.17"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.50.2,<0.51",
    "huggingface-hub>=1.0,<2",
    "pillow>=10",
    "qwen-vl-utils>=0.0.14,<0.1",
    "safetensors>=0.8",
    "torch>=2.9",
    "transformers>=5.17,<5.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hpsv3_4bit"]
