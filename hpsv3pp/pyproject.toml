[project]
name = "hpsv3pp-4bit"
version = "0.1.0"
description = "HPSv3++ BF16 checkpoint construction and NF4 export tools on the original Transformers 4.57.0 layout. Use the repository root project for inference."
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "transformers==4.57.0",
    "trl>=0.12.0",
    "peft>=0.14.0",
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
    "huggingface-hub<1.0,>=0.34",
    "hf-xet>=1.6.0",
    "safetensors>=0.8.0",
    "datasets>=3.0.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0.3",
    "numpy",
    "pandas",
    "pillow>=12.2.0",
    "matplotlib",
    "tqdm",
    "fire",
    "prettytable",
    "requests",
    "packaging",
    "tensorboard",
    "qwen-vl-utils>=0.0.14",
    "sentencepiece>=0.2.2",
    "protobuf",
    "opencv-python-headless",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
